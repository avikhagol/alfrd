[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alfrd"
version = "0.3.0.0"
description = "Automated Logical FRamework for Dynamic script execution (ALFRD)"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
  { name = "Avinash Kumar", email = "avialxee@gmail.com" }
]
urls = { "Homepage" = "https://github.com/avikhagol/alfrd/" }
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Science/Research"
]

dependencies = [
  "jsonschema>=4.18",
  "pandas",
  "numpy",
  "psutil",
  "typer",
  "pyyaml",
  "platformdirs",
  "sqlalchemy>=2.0",
  "flask",
  "flask_sqlalchemy",
  "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7", "pytest-xdist>=3.5", "flask", "flask_sqlalchemy"]
google = [
  "google-api-python-client",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "gspread",
  "gspread-formatting",
]
polars = ["polars"]
all = ["alfrd[google,polars]"]

[project.scripts]
alfrd = "alfrd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"alfrd.schemas" = ["*.json"]
"alfrd.gui" = [
  "templates/auth/*.htm",
  "model/*.sql",
]
"alfrd.web" = [
  "*.html",
  "*.css",
  "css/*.css",
  "css/themes/*/theme.css",
  "css/themes/*/theme.json",
  "js/*.js",
  "js/components/*.js",
  "js/data/*.js",
  "js/utils/*.js",
  "js/vendor/*",
  "assets/*.svg",
  "assets/templates/*.yaml",
  "assets/defaults/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default (pytest-xdist); "serial" tests measure real time and run alone afterwards:
#   pytest -n auto -m "not serial" && pytest -m serial
markers = [
  "slow: builds and installs the alfrd wheel (skip while iterating: -m 'not slow')",
  "serial: depends on wall-clock timing; run without other tests competing for the CPU",
]
