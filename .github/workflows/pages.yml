name: Deploy Workflow Studio to GitHub Pages

# Publishes the static, browser-only Workflow Studio (src/alfrd/web).
# Enable once: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main, master]
    paths:
      - "src/alfrd/web/**"
      - "tests/studio_js/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test browser-side parsers
        run: node --test tests/studio_js/parsers.test.mjs

      - name: Assemble static site
        run: |
          mkdir -p _site
          rsync -a --exclude '*.py' --exclude '__pycache__' src/alfrd/web/ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
