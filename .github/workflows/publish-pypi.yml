name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Run tests
        run: |
          python -m pytest -q -n auto -m "not serial"
          python -m pytest -q -m serial

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              package_version = tomllib.load(stream)["project"]["version"]
          release_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if release_version != package_version:
              raise SystemExit(
                  f"release tag {release_version!r} does not match package version {package_version!r}"
              )
          PY
      - name: Build package
        run: python -m build
      - name: Check distributions
        run: python -m pip install twine && python -m twine check dist/*
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
