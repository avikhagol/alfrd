name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # uv makes the wheel build/install tests take seconds (cached build env and packages).
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4  # tests/test_studio.py runs the Studio's node tests
        with:
          node-version: "20"
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Tests (parallel)
        run: python -m pytest -q -n auto -m "not serial" --durations=15
      - name: Tests that measure time or CPU (alone)
        run: python -m pytest -q -m serial
