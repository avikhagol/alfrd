[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alfrd-ps2pdf"
version = "0.1.0"
description = "Ghostscript PostScript and EPS to PDF converter for ALFRD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."alfrd.plugins"]
ps2pdf = "alfrd_ps2pdf:plugin"

[tool.hatch.build.targets.wheel]
packages = ["alfrd_ps2pdf"]
