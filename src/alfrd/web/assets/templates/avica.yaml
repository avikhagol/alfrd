# ALFRD Studio template: avica
#
# Loaded when alfrd.yaml says `template: avica`. Everything here is a default:
# alfrd.yaml wins for any key it sets (stages, a step's label/category/stage/
# description/metadata/logs, overview.ms_path, project_settings, artifacts).
# Copy a block into alfrd.yaml to change it. Set `skip: true` on a step
# (`steps: {avica_snr: {skip: true}}`) to leave it out of the workflow.
# phaseshift is skipped by default; `steps: {phaseshift: {skip: false}}` runs it.
#
# Placeholders in patterns:
#   {target_dir}  resolved AVICA target_dir        {workdir}  a work dir (e.g. reductions/RDV41/wd)
#   {meta_dir}    {workdir}/<avica.meta_dir>        {logs}     avica.logs (alfrd.yaml avica.logs)
#   {band} {target} {project_code} {n} {step}       *  ?       shell-style wildcards in one folder
# Metadata `file:` entries are relative to {meta_dir}; `require:` lists JSON keys
# that must be present and non-empty (dot paths allowed).

template: avica
description: Automated VLBI calibration in CASA.

stages:
  - {id: preprocess, title: Loading to MeasurementSet}
  - {id: average, title: Average MeasurementSet}
  - {id: automation, title: Automated Metadata and Input generation}
  - {id: calib, title: Calibration Setup & Execution}

# Folder hierarchy below the project (Metadata view, entity paths). A pattern
# starting with {target_dir} is relative to the project root, others to the
# parent level's folder; {from: avica.<key>} reuses the avica: block's patterns
# (alfrd.yaml avica.workdir / band_dir overrides apply). targets_from: files
# whose {target} names a target of that folder.
hierarchy:
  - {level: project_code, dir: "{target_dir}/{project_code}"}
  - level: workdir
    dir: {from: avica.workdir}
    targets_from: ["avica.meta/*_{band}_{target}.avica", "avica.meta/*_{band}_{target}.out"]
  - {level: band, dir: {from: avica.band_dir}}

# Metadata view panels, top to bottom. Panel types: file_status, files,
# json_fields, csv_table, text, image (read by alfrd serve) and avica_config,
# avica_inputs (AVICA's configuration and rPicard inputs, drawn by the Studio).
# scope: the level a panel is evaluated at (project_code, workdir, band) or
# target (once per target, across its work dirs). Replace the list in
# alfrd.yaml `views: {metadata: [...]}`.
views:
  vars:
    meta_dir: {from: avica.meta_dir, prefix: "{workdir}/"}
  metadata:
    - {panel: file_status, title: Metadata health, scope: workdir, files: from_steps}
    - {panel: files, title: avica.meta, scope: workdir, source: "{meta_dir}/*"}
    - {panel: csv_table, title: Result CSV, scope: target, source: result_csv}
    - {panel: image, title: Diagnostics plots, scope: workdir, source: "{workdir}/wd_{band}_{target}/diagnostics_*/*.png", limit: 12}
    - {panel: avica_config, title: AVICA configuration, scope: target}
    - {panel: avica_inputs, title: Input parameters (rPicard *.inp), scope: workdir}

overview:
  # "MS Storage Path" column: first match per target (all matches in the tooltip).
  ms_path:
    - "{workdir}/wd_{band}*_{target}/VLBI_*{band}*.ms.avg"
    - "{workdir}/wd_{band}*_{target}/VLBI_*{band}*.ms"
    - "{workdir}/wd_{band}/VLBI_{band}.ms"
    - "{workdir}/wd_{band}/VLBI_{band}_*.ms"
    - "{workdir}/VLBI.ms"

results:
  # Results view. A target counts as calibrated when its (last, or most recent
  # successful) run of `calibration_step` completed — once per target, however
  # often the step ran. Sources named in that run's `desc` by the
  # `calibrated_sources` regex (group 1, comma separated) other than the targets
  # themselves are counted as calibrated calibrators.
  calibration_step: rpicard
  calibrated_sources: '^calibrated\s+(.+)$'

# The project's target list (Overview → Targets → Import targets CSV…, the Run
# dialog, `alfrd targets import`, `alfrd plan new --from-targets`). Kept across
# plans; execution.plan_csv is the state of one run. Written with the plan CSV's
# column names (execution.key_column / files_column / code_column); `columns:`
# are the header names accepted on import (case-insensitive).
targets:
  csv: alfrd.targets.csv
  columns:
    key: [TARGET_NAME, source, source_name, target, name]
    files: [FILENAMES, fitsfilenames, fits, fitsidi, files]
    code: [PROJECT_CODE, project_code, code]

# Commands ALFRD runs (Studio → Workflow → Run…, `alfrd plan run`). alfrd.yaml
# entrypoints with the same name replace these; `execution:` keys override one by one.
# Placeholders: {target} {step} {from_step} {targets} {plan_csv} {root} and any
# plan CSV column ({FILENAMES}, {PROJECT_CODE}, ...). No shell: one argv item each.
# Studio → Setup wizard: a form for avica.inp in the project folder (see docs/agent-loops.md "Setup forms").
quickstart:
  setup:
    type: form
    title: Set up AVICA
    description: Writes these values to avica.inp in the project folder; other lines and comments stay as they are.
    target: {file: avica.inp}
    fields:
      folder_for_fits: {type: path, label: Raw FITS-IDI folder, required: true, help: Folder with the raw visibility FITS files.}
      casadir: {type: path, label: CASA installation, help: Monolithic CASA folder (casa-6.x…).}
      target_dir: {type: path, label: Output folder, default: reductions, help: Where reductions are written (relative to the project).}
      picard_input_template: {type: path, label: rPICARD input template}
      use_local_antab: {type: toggle, label: Use local .antab files, default: true}
      apply_flag_from_idi: {type: toggle, label: Apply flags from FITS-IDI, default: true}
      fits_to_ms.mpi_cores: {type: number, label: MPI cores · fits_to_ms, min: 1, default: 5}
      rpicard.mpi_cores: {type: number, label: MPI cores · rPICARD, min: 1, default: 10}
      snr_threshold_phref: {type: number, label: SNR threshold (phase reference), min: 0, default: 7}
      size_limit: {type: number, label: Size limit (MB), min: 0, default: 2000.0}
entrypoint:
  - name: avica-step                    # mode: step — one call per target × step
    cmd: [avica, pipe, run, --t, "{target}", --f, "{FILENAMES}", "{step}"]
  - name: avica-target                  # mode: target — one call per target
    cmd: [avica, pipe, run, --t, "{target}", --f, "{FILENAMES}", --resume-from, "{from_step}"]
  - name: avica-batch                   # mode: batch — one call per plan (future AVICA)
    cmd: [avica, pipe, run, --targets, "{targets}", --csvfile, "{plan_csv}"]

execution:
  cwd: "."                              # next to alfrd.yaml / avica.inp
  plan_csv: alfrd.plan.csv              # rows = targets, columns = steps
  mode: step                            # step | target | batch
  step_entrypoint: avica-step           # workflows[].entrypoint / steps[].entrypoint override it
  target_entrypoint: avica-target
  batch_entrypoint: avica-batch
  concurrency: 1                        # targets at once (CASA MPI cores are per step)
  # With concurrency > 1, rows that share a FITS file name run one after the
  # other: AVICA writes files named after the FITS input, so they would clash.
  # The same target with other FITS files runs in parallel. Add columns to
  # serialize on more (e.g. [files, target]; serialize_match: any = one shared
  # value is enough, all = every listed one must be shared).
  serialize_on: [files]
  serialize_match: all
  on_failure: stop_target               # stop_target | continue | stop_plan
  # `avica pipe run` exits 0 after a failed step: the result CSV row decides too.
  status_from: both                     # exit_code | result_csv | both
  launcher: detach                      # detach | systemd-run (survives logout with lingering)
  auto_resume: adopt                    # adopt | always | never (after a restart / runner crash)
  env:
    PYTHONUNBUFFERED: "1"

step_defaults:
  # Added to every step's logs.
  logs:
    - "{logs}/avica_crash_{step}.json"
workflows:
  - name: avica
    steps: [preprocess_fitsidi, fits_to_ms, phaseshift, avica_avg, avicameta_ms, avica_snr, avica_fill_input, avica_split_ms, rpicard]
steps:
  preprocess_fitsidi:
    label: FITS-IDI data processing
    short: proc_fitsidi
    category: FITSIDI
    stage: preprocess
    icon: file
    description: Fixes FITS-IDI data and headers, selects sources, splits by frequency ID and attaches ANTAB.
    inputs: ["folder_for_fits → FITS-IDI"]
    outputs: ["{workdir}/raw/*", "{meta_dir}/fitsfiles_used.avica"]
    metadata:
      - {file: fitsfiles_used.avica, label: FITS files used, require: [filepath]}
      - {file: listobs.json, label: listobs (scans), require: [listobs]}
      - {file: listobs_fits.out, label: listobs (FITS)}
  fits_to_ms:
    label: Convert FITS to CASA Measurement Set
    short: fits2ms
    category: FITSIDI
    stage: preprocess
    icon: convert
    description: importfitsidi into a CASA Measurement Set (and flag it).
    inputs: ["preprocess_fitsidi → {workdir}/raw/*"]
    outputs: ["{workdir}/VLBI.ms", "{meta_dir}/available_wd_ifolder.avica"]
    metadata:
      - {file: available_wd_ifolder.avica, label: Work dirs and input templates, require: [input_folder, fitsfiles]}
    logs:
      - "{workdir}/fits_to_ms_*log*"
  phaseshift:
    label: Phase shifting
    skip: true
    short: phaseshift
    category: MeasurementSet
    stage: preprocess
    icon: shift
    description: Phase-shift sources that are more than 1 arcsecond off the catalogue position.
    inputs: ["fits_to_ms → {workdir}/VLBI.ms"]
    outputs: ["{workdir}/VLBI.ms"]
    logs:
      - "{workdir}/phaseshift_*log*"
  avica_avg:
    label: Data averaging
    short: avg
    category: MeasurementSet
    stage: average
    icon: average
    description: Average to 2 s / 500 kHz per band and split out flagged antennas (CASA mstransform).
    inputs: ["phaseshift → {workdir}/VLBI.ms"]
    outputs: ["{workdir}/wd_{band}/VLBI_{band}.ms", "{meta_dir}/msmeta_sources.avica"]
    metadata:
      - {file: msmeta_sources.avica, label: "MS metadata (bands, spws)", require: [bands_dict]}
    logs:
      - "{workdir}/wd_{band}/avica_avg_*log*"
  avicameta_ms:
    label: Metafile generation
    short: meta_ms
    category: MeasurementSet
    stage: automation
    icon: braces
    description: Identify sources in each band's MS and save msmeta and calibrator roles.
    inputs: ["avica_avg → {workdir}/wd_{band}/VLBI_{band}.ms"]
    outputs: ["{meta_dir}/msmeta_sources_{band}_{target}.avica", "{meta_dir}/sources_ms_{band}_{target}.avica"]
    metadata:
      - {file: "msmeta_sources_{band}_{target}.avica", label: MS metadata per band, require: [bands_dict]}
      - {file: "sources_ms_{band}_{target}.avica", label: Calibrator roles from the MS}
    logs:
      - "{workdir}/wd_{band}/avicameta_ms_*log*"
  avica_snr:
    label: Signal-to-Noise Rating
    short: snr
    category: MeasurementSet
    stage: automation
    icon: snr
    description: Short fringe-fit per band to rate calibrator signal-to-noise and pick reference antennas and calibrators.
    inputs: ["avicameta_ms → {meta_dir}/msmeta_sources_{band}_{target}.avica", "avica_avg → {workdir}/wd_{band}/VLBI_{band}.ms"]
    outputs: ["{meta_dir}/sources_{band}_{target}.avica", "{meta_dir}/refants_{band}_{target}.avica", "{meta_dir}/snrating_{band}_{target}.out"]
    metadata:
      - {file: "sources_{band}_{target}.avica", label: SNR-rated sources, require: [NAME]}
      - {file: "refants_{band}_{target}.avica", label: Reference antennas, require: [refant]}
      - {file: "snrating_{band}_{target}.out", label: SNR rating table}
    logs:
      - "{workdir}/wd_{band}/avica_snr_*log*"
  avica_fill_input:
    label: Fill calibration parameters
    short: fill
    category: MeasurementSet
    stage: automation
    icon: fill
    description: Fill the rPicard input files from the SNR rating metadata.
    inputs: ["avica_snr → {meta_dir}/sources_{band}_{target}.avica", "avica_snr → {meta_dir}/refants_{band}_{target}.avica"]
    outputs: ["{workdir}/wd_{band}_{target}/input_template_{band}_{target}/*.inp", "{meta_dir}/sources_snr_{band}_{target}.avica"]
    metadata:
      - {file: "sources_snr_{band}_{target}.avica", label: Calibrator roles after SNR rating}
    logs:
      - "{workdir}/wd_{band}/avica_fill_input_*log*"
  avica_split_ms:
    label: Split target MS
    short: split
    category: Calibration
    stage: calib
    icon: split
    description: Split each band's MS so it only holds the selected sources (CASA mstransform).
    inputs: ["avica_avg → {workdir}/wd_{band}/VLBI_{band}.ms"]
    outputs: ["{workdir}/wd_{band}_{target}/VLBI_{band}.ms"]
    logs:
      - "{workdir}/wd_{band}_{target}/avica_split_ms_*log*"
  rpicard:
    label: VLBI calibration (rPicard)
    short: rpicard
    category: Calibration
    stage: calib
    icon: pipeline
    description: Run the complete rPicard calibration framework.
    inputs: ["avica_fill_input → input_template_{band}_{target}/*.inp", "picard_input_template_update → *.inp", "avica_split_ms → {workdir}/wd_{band}_{target}/VLBI_{band}.ms"]
    outputs: ["{workdir}/wd_{band}_{target}/*_calibrated.uvf"]
    logs:
      - "{workdir}/wd_{band}_{target}/casa.log_*"
      - "{workdir}/wd_{band}_{target}/mpi_and_err.out_*"
      - "{workdir}/wd_{band}_{target}/diagnostics_*/casa.log_*"

artifacts:
  # kind: collection = a folder of viewable files (Results → Diagnostics). Each
  # path_pattern match is one run; nothing under it is read until the card is
  # opened. include/exclude are relative to the run folder (* within one
  # folder); depth limits how far it is walked.
  - name: rpicard_diagnostics
    description: rPicard calibration diagnostics (plots, flags, fringe-fit overview)
    kind: collection
    viewer: gallery
    step: rpicard
    path_pattern: "{workdir}/wd_{band}_{target}/diagnostics_*"
    run_order: newest
    depth: 3
    pinned: ["*/SUMMARY_*.pdf", "fringes_overview.csv.*", "flags.list"]
    include:
      - "*/*.png"
      - "*/*.pdf"
      - "*/*.ps"
      - "*/*/*.png"
      - "*.pdf"
      - "fringes_overview.csv.*"
      - "*.list"
      - "*.txt"
      - "list.obs"
      - "casa.log_*"
      - "mpi_and_err.out_*"
      - "used_input_files/*.inp"
    exclude: ["*.tmp", "FLAGTABLES/*"]
  - name: avica_logs
    path_pattern: "{logs}/avica__log-*.log"
    description: AVICA run logs
    kind: log
  - name: crash_snapshots
    path_pattern: "{logs}/avica_crash_*.json"
    description: Crash snapshot per step
    kind: json
    show_in_logs: true
  - name: casa_logs
    path_pattern: "casa-*.log"
    description: CASA logs next to alfrd.yaml
    kind: log
