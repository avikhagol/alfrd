{% extends "dashboard/layout.htm" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1>Projects</h1>
  <span class="badge bg-secondary">{{ projects|length }} total</span>
</div>
<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead><tr><th>Name</th><th>Description</th><th></th></tr></thead>
      <tbody>
      {% for project in projects %}
        <tr>
          <td><strong>{{ project.name }}</strong></td>
          <td>{{ project.description or "No description" }}</td>
          <td class="text-end"><a class="btn btn-sm btn-outline-primary" href="{{ url_for('dashboard.project_details', project_name=project.name) }}">View</a></td>
        </tr>
      {% else %}
        <tr><td colspan="3" class="text-center py-5 text-muted">No catalog projects found.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
